---
layout: base.html
---
<article class=card>
  <a class=primary href="{{link}}">
    <h3>{{title}}</h3>
  </a>
  {{ content }}
  {% sidebyside %}
  {%- for tag in tags -%}
  {% if tag != 'webindex' %}
  <a class=gray href='/web/{{tag}}'> #{{tag}} </a>
  {% endif %}
  {%- endfor -%}
  {% endsidebyside %}
</article>
