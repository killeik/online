{% extends "base.html" %}

{% block body %}
  {% include "partials/header.html" %}

  <article>
    <h1>#{{ term.name }}</h1>
    <ul>
      {% for page in term.pages %}
        <li><a href="{{ page.permalink | safe }}">{{ page.title }}</a></li>
      {% endfor %}
    </ul>
  </article>
{% endblock body %}
